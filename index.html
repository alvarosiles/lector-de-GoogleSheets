<!DOCTYPE html>
<!--
  =============================================================
   Editor web para Google Sheets · Frontend
  =============================================================
   Autor:    Alvaro Siles Estrada — Ingeniero de Sistemas · Full Stack Developer
   Licencia: MIT (ver LICENSE)

   Página estática sin dependencias (HTML + CSS + JavaScript nativo)
   que consume la API de apps-script.gs para leer y editar la hoja.
  =============================================================
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Editor web para Google Sheets: consulta y edición de hojas de cálculo desde una interfaz propia, con acceso por token.">
  <meta name="author" content="Alvaro Siles Estrada">
  <title>Mi hoja de Google Sheets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =============================================================
       COLORES (claro / oscuro)
       ============================================================= */
    :root {
      --fondo: #f4f6fb;
      --panel: #ffffff;
      --panel-2: #f8f9fc;
      --texto: #111827;
      --gris: #6b7280;
      --gris-claro: #9ca3af;
      --borde: #e5e7eb;
      --borde-fuerte: #d1d5db;
      --acento: #4f46e5;
      --acento-2: #7c3aed;
      --acento-suave: rgba(79, 70, 229, .10);
      --cambiado: #fef3c7;
      --cambiado-borde: #f59e0b;
      --exito: #059669;
      --error: #dc2626;
      --sombra: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 16px rgba(16, 24, 40, .06);
      --sombra-alta: 0 20px 50px rgba(16, 24, 40, .18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #0b0d12;
        --panel: #12151c;
        --panel-2: #171b24;
        --texto: #e5e7eb;
        --gris: #9ca3af;
        --gris-claro: #6b7280;
        --borde: #232835;
        --borde-fuerte: #2f3545;
        --acento: #818cf8;
        --acento-2: #a78bfa;
        --acento-suave: rgba(129, 140, 248, .14);
        --cambiado: rgba(245, 158, 11, .16);
        --cambiado-borde: #f59e0b;
        --exito: #34d399;
        --error: #f87171;
        --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .3);
        --sombra-alta: 0 20px 50px rgba(0, 0, 0, .6);
      }
    }

    /* =============================================================
       BASE
       ============================================================= */
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    svg { width: 16px; height: 16px; flex-shrink: 0; }

    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: inherit;
      font-weight: 500;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--borde);
      border-radius: 9px;
      background: var(--panel);
      color: var(--texto);
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
    }
    button:hover:not(:disabled) { background: var(--panel-2); border-color: var(--borde-fuerte); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .45; cursor: default; }
    button.icono { width: 34px; padding: 0; justify-content: center; }
    button.principal {
      border: 0;
      color: #fff;
      background: linear-gradient(135deg, var(--acento), var(--acento-2));
      box-shadow: 0 4px 14px rgba(79, 70, 229, .35);
    }
    button.principal:hover:not(:disabled) { background: linear-gradient(135deg, var(--acento), var(--acento-2)); filter: brightness(1.08); }
    .contador {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .25);
      font-size: 12px;
      line-height: 20px;
      text-align: center;
    }
    .contador:empty { display: none; }

    /* =============================================================
       BARRA SUPERIOR
       ============================================================= */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--borde);
    }
    .marca { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
    .logo {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--acento), var(--acento-2));
      color: #fff;
      box-shadow: 0 6px 18px rgba(79, 70, 229, .35);
    }
    .logo svg { width: 20px; height: 20px; }
    .marca h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
    .conexion { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gris); }
    .punto { width: 7px; height: 7px; border-radius: 50%; background: var(--gris-claro); }
    .conexion.ok .punto { background: var(--exito); box-shadow: 0 0 0 3px rgba(5, 150, 105, .18); }
    .conexion.error .punto { background: var(--error); box-shadow: 0 0 0 3px rgba(220, 38, 38, .18); }
    .acciones { display: flex; gap: 8px; }

    /* =============================================================
       BARRA DE FÓRMULA
       ============================================================= */
    .formula {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--borde);
    }
    #nombreCelda {
      width: 64px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background: var(--panel-2);
      font-weight: 600;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .fx { color: var(--gris-claro); font-style: italic; font-weight: 600; padding: 0 4px; }
    #barraFormula {
      flex: 1;
      min-width: 0;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background: var(--panel);
      color: var(--texto);
      font: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    #barraFormula:focus { outline: 0; border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-suave); }

    /* =============================================================
       TABLA
       ============================================================= */
    main { position: relative; flex: 1; overflow: auto; padding: 16px; }
    .tarjeta {
      display: inline-block;
      min-width: 100%;
      border: 1px solid var(--borde);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--sombra);
      overflow: hidden;
    }
    table { border-collapse: separate; border-spacing: 0; }
    th, td { border-right: 1px solid var(--borde); border-bottom: 1px solid var(--borde); padding: 0; height: 32px; }
    th {
      position: sticky;
      background: var(--panel-2);
      color: var(--gris);
      font-weight: 500;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      padding: 0 8px;
      user-select: none;
      transition: background .1s, color .1s;
    }
    thead th { top: 0; z-index: 1; }
    th.numero { left: 0; min-width: 48px; }
    thead th.numero { z-index: 2; }
    th.activo { background: var(--acento-suave); color: var(--acento); font-weight: 700; }

    td { position: relative; background: var(--panel); }
    td input {
      display: block;
      width: 150px;
      height: 32px;
      border: 0;
      padding: 0 10px;
      font: inherit;
      background: transparent;
      color: var(--texto);
    }
    td input:focus { outline: 0; }
    td:focus-within { box-shadow: inset 0 0 0 2px var(--acento); z-index: 1; }
    td.cambiado { background: var(--cambiado); }
    td.cambiado::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      border-left: 7px solid transparent;
      border-top: 7px solid var(--cambiado-borde);
    }

    /* Pantalla de carga */
    .cargando {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: color-mix(in srgb, var(--fondo) 70%, transparent);
      backdrop-filter: blur(2px);
      z-index: 5;
    }
    .cargando.visible { display: grid; }
    .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid var(--borde);
      border-top-color: var(--acento);
      animation: girar .8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* =============================================================
       PIE: PESTAÑAS
       ============================================================= */
    footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--panel);
      border-top: 1px solid var(--borde);
    }
    #pestanas { display: flex; gap: 4px; overflow-x: auto; flex: 1; }
    #pestanas button { border-color: transparent; background: transparent; color: var(--gris); white-space: nowrap; }
    #pestanas button:hover { background: var(--panel-2); color: var(--texto); }
    #pestanas button.activa { background: var(--acento-suave); color: var(--acento); font-weight: 600; }
    .pendiente { width: 6px; height: 6px; border-radius: 50%; background: var(--cambiado-borde); }
    .atajos { font-size: 12px; color: var(--gris-claro); white-space: nowrap; }
    kbd {
      font-family: inherit;
      font-size: 11px;
      padding: 1px 5px;
      border: 1px solid var(--borde);
      border-bottom-width: 2px;
      border-radius: 4px;
      background: var(--panel-2);
    }

    /* =============================================================
       AVISOS (toast)
       ============================================================= */
    #aviso {
      position: fixed;
      left: 50%;
      bottom: 72px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font-weight: 500;
      box-shadow: var(--sombra-alta);
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 20;
    }
    #aviso.visible { opacity: 1; transform: translate(-50%, 0); }
    #aviso.exito svg { color: #34d399; }
    #aviso.error { background: var(--error); }

    /* =============================================================
       VENTANA DEL TOKEN
       ============================================================= */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(10, 12, 18, .5);
      backdrop-filter: blur(4px);
      z-index: 30;
    }
    .modal.visible { display: grid; }
    .modal form {
      width: 100%;
      max-width: 380px;
      padding: 24px;
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--sombra-alta);
    }
    .modal h2 { margin: 0 0 6px; font-size: 18px; }
    .modal p { margin: 0 0 16px; color: var(--gris); line-height: 1.5; }
    .modal input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      margin-bottom: 16px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      background: var(--panel-2);
      color: var(--texto);
      font: inherit;
    }
    .modal input:focus { outline: 0; border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-suave); }
    .modal .botones { display: flex; justify-content: flex-end; gap: 8px; }

    /* =============================================================
       CELULAR
       ============================================================= */
    @media (max-width: 640px) {
      .marca h1 { font-size: 14px; }
      .conexion, .atajos, .texto-boton { display: none; }
      main { padding: 8px; }
      td input { width: 120px; }
    }
  </style>
</head>
<body>

  <!-- ===================== BARRA SUPERIOR ===================== -->
  <header>
    <div class="marca">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
      </div>
      <div>
        <h1>Mi hoja de Google Sheets</h1>
        <div id="conexion" class="conexion"><span class="punto"></span><span id="textoConexion">Conectando…</span></div>
      </div>
    </div>

    <div class="acciones">
      <button id="btnRecargar" class="icono" title="Recargar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button id="btnToken" class="icono" title="Cambiar token">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2M17 6l3 3M14 9l2 2"/></svg>
      </button>
      <button id="btnGuardar" class="principal" disabled title="Guardar (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        <span class="texto-boton">Guardar</span>
        <span id="contador" class="contador"></span>
      </button>
    </div>
  </header>

  <!-- ===================== BARRA DE FÓRMULA ===================== -->
  <div class="formula">
    <div id="nombreCelda">A1</div>
    <span class="fx">fx</span>
    <input id="barraFormula" placeholder="Selecciona una celda para editar" autocomplete="off">
    <button id="btnFila" title="Agregar fila">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="texto-boton">Fila</span>
    </button>
    <button id="btnColumna" title="Agregar columna">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="texto-boton">Columna</span>
    </button>
  </div>

  <!-- ===================== TABLA ===================== -->
  <main>
    <div class="tarjeta"><table id="tabla"></table></div>
    <div id="cargando" class="cargando"><div class="spinner"></div></div>
  </main>

  <!-- ===================== PESTAÑAS ===================== -->
  <footer>
    <nav id="pestanas"></nav>
    <span class="atajos"><kbd>Ctrl</kbd> + <kbd>S</kbd> guardar · <kbd>Enter</kbd> bajar · <kbd>↑↓←→</kbd> moverse</span>
  </footer>

  <!-- ===================== AVISO ===================== -->
  <div id="aviso"></div>

  <!-- ===================== VENTANA DEL TOKEN ===================== -->
  <div id="modalToken" class="modal">
    <form id="formToken">
      <h2>Token de acceso</h2>
      <p>Escribe la clave que pusiste en el Apps Script. Se guarda solo en este navegador.</p>
      <input id="inputToken" type="password" placeholder="Tu token" autocomplete="off" required>
      <div class="botones">
        <button type="button" id="btnCancelarToken">Cancelar</button>
        <button type="submit" class="principal">Conectar</button>
      </div>
    </form>
  </div>

<script>
// =============================================================
//  CONFIGURACIÓN
// =============================================================

// URL de la aplicación web de Apps Script (termina en /exec)
const URL_API = 'https://script.google.com/macros/s/AKfycbx6DwHN0zNWGED3NgKpOQup_quThhyRzOR0UnwxY5LE98PcLm2q51FHYpuHfLq1268n/exec';

// Tamaño mínimo de la tabla en pantalla (para tener celdas vacías donde escribir)
const FILAS_MINIMAS = 30;
const COLUMNAS_MINIMAS = 8;


// =============================================================
//  ESTADO
// =============================================================

let hojas = [];         // [{ nombre: 'Hoja 1', valores: [[...], [...]] }, ...]
let hojaActual = 0;     // índice de la pestaña que se está viendo
let cambios = {};       // { 'Hoja 1': { '1,1': 'Hola' } }  → celdas pendientes de guardar
let inputs = [];        // inputs[fila][columna] de la tabla visible
let seleccion = { f: 0, c: 0 };

const $ = (id) => document.getElementById(id);


// =============================================================
//  UTILIDADES
// =============================================================

// 0 → A, 1 → B, ... 26 → AA
function letraColumna(n) {
  let letra = '';
  for (n++; n > 0; n = Math.floor((n - 1) / 26)) {
    letra = String.fromCharCode(65 + ((n - 1) % 26)) + letra;
  }
  return letra;
}

function totalCambios() {
  return Object.values(cambios).reduce((total, c) => total + Object.keys(c).length, 0);
}

function actualizarBotonGuardar() {
  const total = totalCambios();
  $('btnGuardar').disabled = total === 0;
  $('contador').textContent = total || '';
}

function mostrarConexion(texto, tipo) {
  $('textoConexion').textContent = texto;
  $('conexion').className = 'conexion ' + (tipo || '');
}

let temporizadorAviso;
function mostrarAviso(texto, tipo) {
  const iconos = {
    exito: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>'
  };
  const aviso = $('aviso');
  aviso.innerHTML = (iconos[tipo] || '') + '<span></span>';
  aviso.querySelector('span').textContent = texto;
  aviso.className = 'visible ' + (tipo || '');
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => aviso.classList.remove('visible'), tipo === 'error' ? 5000 : 2500);
}

function mostrarCargando(si) {
  $('cargando').classList.toggle('visible', si);
}


// =============================================================
//  TOKEN (se guarda solo en este navegador)
// =============================================================

function leerToken() {
  try { return localStorage.getItem('tokenHoja'); } catch (e) { return null; }
}

function pedirToken() {
  $('inputToken').value = leerToken() || '';
  $('modalToken').classList.add('visible');
  setTimeout(() => $('inputToken').focus(), 50);
}

$('formToken').onsubmit = (e) => {
  e.preventDefault();
  try { localStorage.setItem('tokenHoja', $('inputToken').value.trim()); } catch (err) {}
  $('modalToken').classList.remove('visible');
  cargar();
};
$('btnCancelarToken').onclick = () => $('modalToken').classList.remove('visible');


// =============================================================
//  DIBUJAR
// =============================================================

function dibujarPestanas() {
  $('pestanas').innerHTML = '';
  hojas.forEach((hoja, i) => {
    const boton = document.createElement('button');
    boton.textContent = hoja.nombre;
    if (Object.keys(cambios[hoja.nombre] || {}).length) {
      boton.insertAdjacentHTML('beforeend', '<span class="pendiente" title="Cambios sin guardar"></span>');
    }
    boton.className = i === hojaActual ? 'activa' : '';
    boton.onclick = () => { hojaActual = i; seleccion = { f: 0, c: 0 }; dibujarTodo(); };
    $('pestanas').appendChild(boton);
  });
}

function dibujarTabla() {
  const hoja = hojas[hojaActual];
  const valores = hoja.valores;
  const filas = Math.max(FILAS_MINIMAS, valores.length);
  const columnas = Math.max(COLUMNAS_MINIMAS, ...valores.map(f => f.length));
  const pendientes = cambios[hoja.nombre] || {};

  const tabla = $('tabla');
  tabla.innerHTML = '';
  inputs = [];

  // Encabezado: A, B, C...
  const encabezado = tabla.createTHead().insertRow();
  encabezado.appendChild(Object.assign(document.createElement('th'), { className: 'numero' }));
  for (let c = 0; c < columnas; c++) {
    encabezado.appendChild(Object.assign(document.createElement('th'), { textContent: letraColumna(c) }));
  }

  // Filas: 1, 2, 3...
  const cuerpo = tabla.createTBody();
  for (let f = 0; f < filas; f++) {
    const fila = cuerpo.insertRow();
    fila.appendChild(Object.assign(document.createElement('th'), { className: 'numero', textContent: f + 1 }));
    inputs[f] = [];

    for (let c = 0; c < columnas; c++) {
      const clave = (f + 1) + ',' + (c + 1);          // fila,columna empezando en 1
      const celda = fila.insertCell();
      const input = document.createElement('input');

      if (clave in pendientes) {
        input.value = pendientes[clave];
        celda.className = 'cambiado';
      } else {
        input.value = (valores[f] && valores[f][c]) || '';
      }

      input.oninput = () => cambiarCelda(f, c, input.value);
      input.onfocus = () => seleccionar(f, c);
      input.onkeydown = (e) => moverConTeclado(e, f, c);

      celda.appendChild(input);
      inputs[f][c] = input;
    }
  }

  seleccionar(Math.min(seleccion.f, filas - 1), Math.min(seleccion.c, columnas - 1));
}

function dibujarTodo() {
  dibujarPestanas();
  dibujarTabla();
  actualizarBotonGuardar();
}


// =============================================================
//  EDITAR Y MOVERSE
// =============================================================

function cambiarCelda(f, c, valor) {
  const nombre = hojas[hojaActual].nombre;
  const habiaCambios = Object.keys(cambios[nombre] || {}).length > 0;

  cambios[nombre] = cambios[nombre] || {};
  cambios[nombre][(f + 1) + ',' + (c + 1)] = valor;
  inputs[f][c].parentElement.classList.add('cambiado');

  actualizarBotonGuardar();
  if (!habiaCambios) dibujarPestanas();   // mostrar el punto de "pendiente"
}

function seleccionar(f, c) {
  seleccion = { f, c };
  $('nombreCelda').textContent = letraColumna(c) + (f + 1);
  $('barraFormula').value = inputs[f][c].value;

  // Resaltar la letra de la columna y el número de la fila
  document.querySelectorAll('th.activo').forEach(th => th.classList.remove('activo'));
  $('tabla').tHead.rows[0].cells[c + 1].classList.add('activo');
  $('tabla').tBodies[0].rows[f].cells[0].classList.add('activo');
}

function irA(f, c) {
  if (inputs[f] && inputs[f][c]) {
    inputs[f][c].focus();
    inputs[f][c].select();
  }
}

function moverConTeclado(e, f, c) {
  const input = e.target;
  const alInicio = input.selectionStart === 0 && input.selectionEnd === 0;
  const alFinal = input.selectionStart === input.value.length;

  if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); irA(f + 1, c); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); irA(f - 1, c); }
  else if (e.key === 'ArrowLeft' && alInicio) { e.preventDefault(); irA(f, c - 1); }
  else if (e.key === 'ArrowRight' && alFinal) { e.preventDefault(); irA(f, c + 1); }
}

// La barra de fórmula edita la celda seleccionada
$('barraFormula').oninput = () => {
  const { f, c } = seleccion;
  if (!inputs[f]) return;   // todavía no cargó la hoja
  inputs[f][c].value = $('barraFormula').value;
  cambiarCelda(f, c, $('barraFormula').value);
};
$('barraFormula').onkeydown = (e) => {
  if (e.key === 'Enter') { e.preventDefault(); irA(seleccion.f + 1, seleccion.c); }
};


// =============================================================
//  CARGAR Y GUARDAR (conexión con Apps Script)
// =============================================================

async function cargar() {
  const token = leerToken();
  if (!token) { mostrarConexion('Sin token', 'error'); return pedirToken(); }

  mostrarCargando(true);
  mostrarConexion('Conectando…');
  try {
    const respuesta = await fetch(URL_API + '?token=' + encodeURIComponent(token));
    const datos = await respuesta.json();
    if (!datos.ok) throw new Error(datos.error);
    if (!datos.hojas) throw new Error('falta actualizar el Apps Script (ver apps-script.gs)');

    hojas = datos.hojas;
    hojaActual = Math.min(hojaActual, hojas.length - 1);
    cambios = {};
    dibujarTodo();
    mostrarConexion('Conectado · ' + hojas.length + (hojas.length === 1 ? ' hoja' : ' hojas'), 'ok');
  } catch (error) {
    mostrarConexion('Sin conexión', 'error');
    mostrarAviso('Error al cargar: ' + error.message, 'error');
    if (error.message === 'token inválido') pedirToken();
  } finally {
    mostrarCargando(false);
  }
}

async function guardar() {
  const token = leerToken();
  if (!token) return pedirToken();
  if (totalCambios() === 0) return;

  $('btnGuardar').disabled = true;
  mostrarCargando(true);

  try {
    let guardados = 0;

    // Se envía una petición por cada pestaña que tenga cambios
    for (const nombreHoja of Object.keys(cambios)) {
      const lista = Object.entries(cambios[nombreHoja]).map(([clave, valor]) => {
        const [fila, columna] = clave.split(',').map(Number);
        return { fila, columna, valor };
      });
      if (lista.length === 0) continue;

      // 'text/plain' es necesario para que el navegador permita llamar a Apps Script
      const respuesta = await fetch(URL_API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ token, hoja: nombreHoja, cambios: lista })
      });
      const datos = await respuesta.json();
      if (!datos.ok) throw new Error(datos.error);

      // Pasar los cambios guardados a los datos locales
      const hoja = hojas.find(h => h.nombre === nombreHoja);
      lista.forEach(({ fila, columna, valor }) => {
        while (hoja.valores.length < fila) hoja.valores.push([]);
        hoja.valores[fila - 1][columna - 1] = valor;
      });
      delete cambios[nombreHoja];
      guardados += lista.length;
    }

    dibujarTodo();
    mostrarAviso(guardados === 1 ? '1 celda guardada' : guardados + ' celdas guardadas', 'exito');
  } catch (error) {
    actualizarBotonGuardar();
    mostrarAviso('Error al guardar: ' + error.message, 'error');
  } finally {
    mostrarCargando(false);
  }
}


// =============================================================
//  BOTONES Y ATAJOS
// =============================================================

$('btnGuardar').onclick = guardar;
$('btnToken').onclick = pedirToken;

$('btnRecargar').onclick = () => {
  if (totalCambios() && !confirm('Hay cambios sin guardar. ¿Recargar igual?')) return;
  cargar();
};

$('btnFila').onclick = () => {
  const valores = hojas[hojaActual].valores;
  const filas = Math.max(FILAS_MINIMAS, valores.length);
  while (valores.length <= filas) valores.push([]);
  dibujarTabla();
  irA(filas, seleccion.c);
};

$('btnColumna').onclick = () => {
  const valores = hojas[hojaActual].valores;
  if (valores.length === 0) valores.push([]);
  const columnas = Math.max(COLUMNAS_MINIMAS, ...valores.map(f => f.length));
  valores[0][columnas] = '';
  dibujarTabla();
  irA(seleccion.f, columnas);
};

// Ctrl+S (o Cmd+S en Mac) para guardar
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    guardar();
  }
  if (e.key === 'Escape') $('modalToken').classList.remove('visible');
});

// Avisar si se cierra la página con cambios sin guardar
window.addEventListener('beforeunload', (e) => {
  if (totalCambios()) { e.preventDefault(); e.returnValue = ''; }
});

cargar();
</script>
